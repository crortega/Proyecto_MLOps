# ==============================================================================
# ARCHIVO: .github/workflows/ci.yml
# QUE HACE: Automatiza todo el flujo MLOps en GitHub cada vez que haces push.
# ==============================================================================

name: MLOps End-to-End Pipeline

# Cuando se dispara este robot: al hacer push o pull request en main o master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]




jobs:
  mlops-pipeline:
    # Usamos una maquina virtual limpia con Ubuntu
    runs-on: ubuntu-latest

    steps:
      # PASO 1: Descargar nuestro codigo del repositorio en la maquina virtual
      - name: Checkout del repositorio
        uses: actions/checkout@v4



      # PASO 2: Instalar Python 3.10
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'



      # PASO 3: Instalar todas las librerias del requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt



      # PASO 4: Ejecutar la tuberia de datos en orden estricto[cite: 1, 6]
      - name: 1. Extraccion de datos
        run: python src/data_extraction.py

      - name: 2. Validacion de datos
        run: python src/data_validation.py

      - name: 3. Limpieza e ingenieria de variables
        run: python src/data_cleaning.py



      # PASO 5: Entrenar modelos y elegir al campeon[cite: 1, 6]
      - name: 4. Entrenamiento y registro en MLflow
        run: python src/train.py

      - name: 5. Evaluacion Quality Gate y seleccion Champion
        run: python src/evaluate_champion.py



      # PASO 6: Arrancar la API en segundo plano y probar que los 3 endpoints responden[cite: 1]
      - name: 6. Pruebas de integracion de la API FastAPI
        run: |
          # Arrancamos uvicorn en segundo plano (&)
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          
          # Esperamos 5 segundos a que la API termine de arrancar y cargar el modelo
          sleep 5
          
          # Probamos GET /health (si devuelve error, -f hace que el comando falle y pare el pipeline)
          echo "Probando /health..."
          curl -f http://127.0.0.1:8000/health
          
          # Probamos GET /model-info
          echo -e "\nProbando /model-info..."
          curl -f http://127.0.0.1:8000/model-info
          
          # Probamos POST /predict mandando un paciente de ejemplo en JSON
          echo -e "\nProbando /predict..."
          curl -f -X POST "http://127.0.0.1:8000/predict" \
               -H "Content-Type: application/json" \
               -d '{"age": 0.038, "sex": 0.050, "bmi": 0.061, "bp": 0.021, "s1": -0.044, "s2": -0.034, "s3": -0.043, "s4": -0.002, "s5": 0.019, "s6": -0.017}'